{{ define "main" }}
<article class="post">
  <h1 class="post-title">
    <a href="{{ .Permalink }}">{{ .Title | markdownify }}</a>
  </h1>

  {{ with .Params.cost }}
    <div class="look-meta">{{ . }}</div>
  {{ end }}

  {{ with .Params.video }}
    <video class="look-video" controls muted loop playsinline preload="none"
      {{ with $.Params.poster }}poster="{{ . | relURL }}"{{ end }}>
      <source src="{{ . }}" type="video/mp4">
    </video>
  {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ with .Params.source }}
    <p class="look-source"><a href="{{ . }}">Source</a></p>
  {{ end }}
</article>
{{ end }}
