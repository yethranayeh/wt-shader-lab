baseURL = "https://yethranayeh.github.io/wt-shader-lab/"
locale = "en"
title = "wt-shader-lab"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[pagination]
  pagerSize = 5

[params]
  contentTypeName = "docs"
  centerTheme = true
  fullWidthTheme = false

[languages]
  [languages.en]
    title = "wt-shader-lab"
    copyright = "© 2026 Alper Halil"

    [languages.en.params]
      subtitle = "Pixel shaders for Windows Terminal that stay readable."
      readMore = "Read"
      readOtherPosts = "Other looks"
      menuMore = "More"

      [languages.en.params.logo]
        logoText = "wt-shader-lab"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/yethranayeh/wt-shader-lab"
