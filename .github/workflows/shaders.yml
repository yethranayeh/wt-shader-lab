name: Shaders

on:
  push:
    branches: [main]
    paths:
      - "shaders/**"
      - "tools/compile-shaders.ps1"
      - ".github/workflows/shaders.yml"
  pull_request:
    paths:
      - "shaders/**"
      - "tools/compile-shaders.ps1"
      - ".github/workflows/shaders.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile with fxc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile every shader
        shell: pwsh
        run: ./tools/compile-shaders.ps1

  blocks:
    name: Shared blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare the shared symbols
        run: python3 tools/check-shared-blocks.py
